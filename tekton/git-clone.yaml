apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:

  params:
    - name: url
      type: string
      description: Git repository URL

    - name: revision
      type: string
      default: main
      description: Git branch, tag or commit

  workspaces:
    - name: source

  steps:
    - name: clone
      image: alpine/git:2.47.2

      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -eu

        echo "Cleaning workspace..."
        rm -rf "$(workspaces.source.path)"/* \
               "$(workspaces.source.path)"/.[!.]* \
               "$(workspaces.source.path)"/..?* 2>/dev/null || true

        echo "Cloning repository: $(params.url)"
        git clone \
          --branch "$(params.revision)" \
          --single-branch \
          "$(params.url)" \
          "$(workspaces.source.path)"

        echo "Git clone completed"

        echo "Current commit:"
        git rev-parse HEAD