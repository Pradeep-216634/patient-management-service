apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build

spec:

  workspaces:
    - name: source

  steps:

    - name: build

      image: maven:3.9-eclipse-temurin-21

      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -eu

        echo "====================================="
        echo "Building Patient Management Service"
        echo "====================================="

        java -version
        mvn -version

        mvn clean verify --batch-mode

        echo "====================================="
        echo "Build completed successfully"
        echo "====================================="

        ls -la target