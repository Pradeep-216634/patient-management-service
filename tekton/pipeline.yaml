apiVersion: tekton.dev/v1
kind: Pipeline

metadata:
  name: patient-management-ci

spec:

  params:

    - name: git-url
      type: string

    - name: git-revision
      type: string
      default: main

    - name: image
      type: string

    - name: ecr-registry
      type: string

  workspaces:

    - name: shared-workspace

  tasks:

    # -------------------------
    # Clone
    # -------------------------

    - name: clone-source

      taskRef:
        name: git-clone

      params:

        - name: url
          value: $(params.git-url)

        - name: revision
          value: $(params.git-revision)

      workspaces:

        - name: source
          workspace: shared-workspace


    # -------------------------
    # Maven build
    # -------------------------

    - name: build-application

      runAfter:
        - clone-source

      taskRef:
        name: maven-build

      workspaces:

        - name: source
          workspace: shared-workspace


    # -------------------------
    # Container image + ECR
    # -------------------------

    - name: build-container-image

      runAfter:
        - build-application

      taskRef:
        name: build-image

      params:

        - name: IMAGE
          value: $(params.image)

        - name: ECR_REGISTRY
          value: $(params.ecr-registry)

      workspaces:

        - name: source
          workspace: shared-workspace